name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check

  e2e:
    name: End-to-end (Firebase emulators · Socket.IO · browsers)
    runs-on: ubuntu-latest
    needs: verify
    services:
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      REDIS_URL: redis://localhost:6380
      WEB_ORIGIN: http://localhost:3000
      FIREBASE_PROJECT_ID: demo-cardroom
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_GAME_SERVER_URL: http://localhost:4000
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-cardroom
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@cardroom/server...
      - run: pnpm --filter @cardroom/web exec playwright install --with-deps chromium
      - name: Emulators + suites
        run: pnpm exec firebase emulators:exec --only auth,firestore --project demo-cardroom "sh scripts/ci-e2e.sh"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            server.log
            apps/web/playwright-report
            apps/web/test-results
